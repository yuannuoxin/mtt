<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>JWT Token 验签工具（Supabase）</title>
    <style>
        * {box-sizing: border-box;}
        body {max-width: 900px; margin: 20px auto; padding: 0 15px; font-family: Arial;}
        textarea {width: 100%; height: 120px; padding: 10px; font-size: 14px; margin: 10px 0;}
        button {padding: 12px 20px; background: #0070f3; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px;}
        .result {margin-top: 20px; padding: 15px; background: #f7f7f7; border-radius: 8px; white-space: pre-wrap;}
        .title {font-size: 18px; font-weight: bold; margin-bottom: 10px;}
    </style>
</head>
<body>
<div class="title">输入 Supabase Access Token 验签</div>
<textarea id="tokenInput" placeholder="粘贴你的 JWT Token 到这里..."></textarea>
<button onclick="verifyToken()">开始验证签名</button>

<div id="result" class="result"></div>

<script>
    const SUPABASE_URL = "https://hlhehldribarkqbwwccz.supabase.co";

    // 验签主方法
    async function verifyToken() {
        const token = document.getElementById("tokenInput").value.trim();
        const resultEl = document.getElementById("result");

        if (!token) {
            resultEl.innerText = "请输入 Token！";
            return;
        }

        resultEl.innerText = "⌛ 正在验证中...";

        try {
            // 1. 拆分 Token
            const [header, payload, signature] = token.split(".");
            if (!header || !payload || !signature) throw new Error("Token 格式不正确");

            const data = new TextEncoder().encode(header + "." + payload);

            // 2. 获取 JWKS 公钥
            const jwksResp = await fetch(`${SUPABASE_URL}/auth/v1/.well-known/jwks.json`);
            const jwks = await jwksResp.json();
            const key = jwks.keys[0];

            // 3. 生成公钥
            const xBytes = base64UrlToBytes(key.x);
            const yBytes = base64UrlToBytes(key.y);
            const rawPublicKey = new Uint8Array([0x04, ...xBytes, ...yBytes]);
            const fullPublicKeyBase64 = bytesToBase64(rawPublicKey);

            // 4. 导入公钥并验签
            const publicKey = await crypto.subtle.importKey(
                "raw", rawPublicKey,
                { name: "ECDSA", namedCurve: "P-256" },
                false, ["verify"]
            );

            const sigBytes = base64UrlToBytes(signature);
            const isValid = await crypto.subtle.verify(
                { name: "ECDSA", hash: "SHA-256" },
                publicKey, sigBytes, data
            );

            // 输出结果
            resultEl.innerText = `
✅ 验签完成

=== 验签结果 ===
${isValid ? "✅ 签名有效（真实有效）" : "❌ 签名无效"}

=== 公钥信息 ===
kid: ${key.kid}
x: ${key.x}
y: ${key.y}

完整公钥（Base64）：
${fullPublicKeyBase64}
        `;

        } catch (e) {
            resultEl.innerText = "❌ 验签失败：" + e.message;
        }
    }

    // ========== 工具方法 ==========
    function base64UrlToBytes(str) {
        str = str.replaceAll("-", "+").replaceAll("_", "/");
        while (str.length % 4) str += "=";
        return Uint8Array.from(atob(str), c => c.charCodeAt(0));
    }

    function bytesToBase64(bytes) {
        return btoa(String.fromCharCode(...bytes));
    }
</script>
</body>
</html>
